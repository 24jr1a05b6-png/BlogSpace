<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in | BlogSpace</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="header">
    <div class="container">
      <a href="index.html" class="logo">BlogSpace<span>.</span></a>
      <nav class="nav-links"><a href="index.html">Home</a></nav>
      <div class="auth-actions"></div>
    </div>
  </header>

  <main class="page container">
    <div class="form-container">
      <h1>Welcome back</h1>
      <p style="color:var(--text-light); margin-bottom: 1.5rem;">Sign in to your account to continue.</p>

      <form id="loginForm">
        <div class="form-group">
          <label for="email">Email address</label>
          <input type="email" id="email" name="email" placeholder="you@example.com" required>
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="••••••••" required>
        </div>
        <div class="form-actions" style="justify-content: space-between; align-items: center;">
          <button type="submit" class="btn btn-primary">Sign in</button>
          <a href="register.html" class="btn btn-outline">Create account</a>
        </div>
      </form>
      <p style="margin-top:1rem; color:var(--text-light); text-align:center;">
        Don't have an account? <a href="register.html">Register here</a>
      </p>
    </div>
  </main>

  <footer class="footer">
    <div class="container">
      <p>&copy; <span id="year"></span> BlogSpace.</p>
    </div>
  </footer>

  <script src="js/app.js"></script>
  <script>
    document.getElementById('year').textContent = new Date().getFullYear();
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = e.target.querySelector('button[type="submit"]');
      const original = btn.textContent;
      btn.textContent = 'Signing in...';
      btn.disabled = true;
      try {
        await BlogSpace.apiRequest('/auth/login', {
          method: 'POST',
          body: {
            email: document.getElementById('email').value,
            password: document.getElementById('password').value,
          },
        });
        BlogSpace.showNotification('Logged in successfully!', 'success');
        setTimeout(() => { window.location.href = 'index.html'; }, 800);
      } catch (err) {
        BlogSpace.showNotification(err.message || 'Login failed', 'error');
        btn.textContent = original;
        btn.disabled = false;
      }
    });
    BlogSpace.initApp();
  </script>
</body>
</html>
