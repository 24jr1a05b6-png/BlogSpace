<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BlogSpace | Post</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="header">
    <div class="container">
      <a href="index.html" class="logo">BlogSpace<span>.</span></a>
      <nav class="nav-links"><a href="index.html">Home</a><a href="my-posts.html" id="nav-myposts">My Posts</a></nav>
      <div class="auth-actions">
        <a href="login.html" id="nav-login" class="btn btn-primary btn-sm">Sign in</a>
        <div class="user-menu" id="user-menu" style="display:none;">
          <span class="user-greeting" id="user-greeting"></span>
          <button class="btn btn-danger btn-sm" id="btn-logout">Sign out</button>
        </div>
      </div>
    </div>
  </header>

  <main class="page container">
    <section class="article-header">
      <div class="container">
        <article id="postContent">
          <div id="loadingPost" class="loading show">
            <div class="spinner"></div>
            <p>Loading post...</p>
          </div>
          <div id="postNotFound" style="display:none; text-align:center; padding: 3rem 0;">
            <h2>Post not found</h2>
            <p>The post you are looking for does not exist or has been removed.</p>
            <a href="index.html" class="btn btn-primary">Go back home</a>
          </div>
          <div id="postView" style="display:none;">
            <div id="postCover" style="margin-bottom:1rem;"></div>
            <div class="article-meta" id="postMeta"></div>
            <h1 class="article-title" id="postTitle"></h1>
            <div class="article-actions" id="postActions"></div>
            <div class="article-content" id="postBody"></div>
          </div>
        </article>
      </div>
    </section>

    <section class="comments-section">
      <div class="container">
        <div class="comment-form">
          <h3>Add a comment</h3>
          <form id="commentForm">
            <textarea id="commentText" name="text" placeholder="Write a comment..." required></textarea>
            <button type="submit" class="btn btn-primary" style="margin-top:1rem;">Post comment</button>
          </form>
        </div>

        <h2><span>💬</span> Comments <span id="commentsCount" style="font-weight:normal; font-size:0.9rem; color:var(--text-light);"></span></h2>
        <div id="loadingComments" class="loading show" style="text-align:center; padding:1rem;">
          <div class="spinner"></div>
        </div>
        <div id="commentsList" class="comments-list"></div>
        <div id="noComments" style="display:none; text-align:center; color:var(--text-light); padding: 2rem 0;">
          No comments yet. Be the first to comment!
        </div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="container">
      <p>&copy; <span id="year"></span> BlogSpace.</p>
    </div>
  </footer>

  <script src="js/app.js"></script>
  <script src="js/post.js"></script>
  <script>
    document.getElementById('year').textContent = new Date().getFullYear();
    BlogSpace.initApp();
    const params = new URLSearchParams(window.location.search);
    const postId = params.get('id');
    if (postId) BlogSpace.loadPost(postId);
    else { document.getElementById('postNotFound').style.display = 'block'; document.getElementById('loadingPost').style.display = 'none'; }
  </script>
</body>
</html>
