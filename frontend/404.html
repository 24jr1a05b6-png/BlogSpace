<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found | BlogSpace</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="header">
    <div class="container">
      <a href="index.html" class="logo">BlogSpace<span>.</span></a>
      <nav class="nav-links"><a href="index.html">Home</a></nav>
      <div class="auth-actions"></div>
    </div>
  </header>

  <main class="page container">
    <div class="not-found">
      <h1>404</h1>
      <p>Oops! The page you're looking for doesn't exist.</p>
      <a href="index.html" class="btn btn-primary">Go back home</a>
    </div>
  </main>

  <footer class="footer">
    <div class="container">
      <p>&copy; <span id="year"></span> BlogSpace.</p>
    </div>
  </footer>

  <script src="js/app.js"></script>
  <script>
    document.getElementById('year').textContent = new Date().getFullYear();
    BlogSpace.initApp();
  </script>
</body>
</html>
