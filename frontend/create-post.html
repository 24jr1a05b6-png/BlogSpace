<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Post | BlogSpace</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="header">
    <div class="container">
      <a href="index.html" class="logo">BlogSpace<span>.</span></a>
      <nav class="nav-links"><a href="index.html">Home</a><a href="my-posts.html" id="nav-myposts">My Posts</a></nav>
      <div class="auth-actions">
        <a href="login.html" id="nav-login" class="btn btn-primary btn-sm">Sign in</a>
        <div class="user-menu" id="user-menu" style="display:none;">
          <span class="user-greeting" id="user-greeting"></span>
          <button class="btn btn-danger btn-sm" id="btn-logout">Sign out</button>
        </div>
      </div>
    </div>
  </header>

  <main class="page container">
    <div class="form-container">
      <h1 id="pageTitle">Create a new post</h1>
      <p style="color:var(--text-light); margin-bottom: 1.5rem;" id="pageSubtitle">Share your story with the community.</p>

      <form id="postForm">
        <input type="hidden" id="postId" name="postId">
        <div class="form-group">
          <label for="title">Title <span style="color:var(--danger)">*</span></label>
          <input type="text" id="title" name="title" placeholder="Post title" required maxlength="200">
        </div>
        <div class="form-group">
          <label for="category">Category</label>
          <select id="category" name="category">
            <option value="">Select a category</option>
          </select>
        </div>
        <div class="form-group">
          <label for="coverImage">Cover image URL (optional)</label>
          <input type="url" id="coverImage" name="coverImage" placeholder="https://example.com/image.jpg">
        </div>
        <div class="form-group">
          <label for="content">Content <span style="color:var(--danger)">*</span></label>
          <textarea id="content" name="content" placeholder="Write your post content here..." required></textarea>
        </div>
        <div class="form-actions">
          <a href="index.html" class="btn btn-secondary">Cancel</a>
          <button type="submit" class="btn btn-primary" id="submitBtn">Save post</button>
        </div>
      </form>
    </div>
  </main>

  <footer class="footer">
    <div class="container">
      <p>&copy; <span id="year"></span> BlogSpace.</p>
    </div>
  </footer>

  <script src="js/app.js"></script>
  <script src="js/create-post.js"></script>
  <script>
    document.getElementById('year').textContent = new Date().getFullYear();
    BlogSpace.initApp();
    const params = new URLSearchParams(window.location.search);
    const postId = params.get('id');
    if (postId) BlogSpace.loadPostForEdit(postId);
  </script>
</body>
</html>
