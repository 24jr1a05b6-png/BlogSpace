<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Posts | BlogSpace</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="header">
    <div class="container">
      <a href="index.html" class="logo">BlogSpace<span>.</span></a>
      <nav class="nav-links"><a href="index.html">Home</a><a href="my-posts.html" class="active">My Posts</a></nav>
      <div class="auth-actions">
        <a href="login.html" id="nav-login" class="btn btn-primary btn-sm">Sign in</a>
        <div class="user-menu" id="user-menu" style="display:none;">
          <span class="user-greeting" id="user-greeting"></span>
          <button class="btn btn-danger btn-sm" id="btn-logout">Sign out</button>
        </div>
      </div>
    </div>
  </header>

  <main class="page container">
    <div class="my-posts-header">
      <div>
        <h1>My Posts</h1>
        <p style="color:var(--text-light); font-size:0.9rem;">Manage your published posts.</p>
      </div>
      <a href="create-post.html" class="btn btn-primary">New Post</a>
    </div>

    <div id="loadingMyPosts" class="loading show" style="text-align:center; padding:2rem;">
      <div class="spinner"></div>
      <p>Loading your posts...</p>
    </div>

    <div id="emptyMyPosts" class="empty-state" style="display:none;">
      <h2>No posts yet</h2>
      <p>You haven't published any posts. Create your first post to get started.</p>
      <a href="create-post.html" class="btn btn-primary">Create post</a>
    </div>

    <div id="myPostsContainer"></div>
  </main>

  <footer class="footer">
    <div class="container">
      <p>&copy; <span id="year"></span> BlogSpace.</p>
    </div>
  </footer>

  <script src="js/app.js"></script>
  <script src="js/my-posts.js"></script>
  <script>
    document.getElementById('year').textContent = new Date().getFullYear();
    BlogSpace.initApp();
    BlogSpace.loadMyPosts();
  </script>
</body>
</html>
